[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-ai-agent-security-silver"
version = "0.1.0"
description = "Reproducible silver-medal solution path for Kaggle AI Agent Security"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhibo Lin" }]
keywords = ["kaggle", "agent-security", "red-teaming", "tool-use", "ai-safety"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["attack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
